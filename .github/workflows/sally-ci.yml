name: GitHub Actions for Sally
on:
  push:
    branches:
      - 'main'
      - 'dev'
  pull_request:
  workflow_dispatch:

# Define environment variables
env:
  PYTHON_VERSION: "3.12.10"
  PIP_CACHE_DIR: "~/.cache/pip" # Default for Linux, will adjust  for MacOS"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, ubuntu-latest ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip' # Enable built-in pip caching
          cache-dependency-path: | 
            **/requirements.txt
            **/setup.py # catches changes in install_requires

      - name: Install native dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libsodium
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix libsodium)/lib" >> "$GITHUB_ENV"
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install --prefer-binary -r requirements.txt; fi
        shell: bash

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint changes
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || exit 1
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --ignore=E7,F841,E301,E302,E303 --max-complexity=10 --max-line-length=127 --statistics
        shell: bash

      - name: Run core Sally tests
        run: |
          pytest tests/
          python tests/integration/check_reporting.py --output "$RUNNER_TEMP/reporting-base"
        shell: bash

      - name: Run tests with optional Sentry reporting installed
        run: |
          pip install '.[sentry]'
          pip check
          pytest tests/
          python tests/integration/check_reporting.py --sentry --output "$RUNNER_TEMP/reporting-errors"
          python tests/integration/check_reporting.py --sentry --logs-level WARNING --output "$RUNNER_TEMP/reporting-warning"
          python tests/integration/check_reporting.py --sentry --logs-level INFO --output "$RUNNER_TEMP/reporting-info"
        shell: bash
